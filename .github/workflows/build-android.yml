name: build-android

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  # 与仓库 .github/workflows/build.yaml 保持一致，改 Flutter 版本前先看 .agents/flutter-upgrade.md
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    # 放在 job 级别，step 的 if 条件才能读到 env（step 自己的 env 在 if 阶段还不可用）。
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # .gitmodules 里写的是 git@github.com: 的 SSH 地址，runner 上没有 SSH key，
      # 这里统一改写为 HTTPS 再拉子模块（Clash.Meta 核心与 prism_ui）。
      - name: Checkout submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # :core 模块通过 gomobile bind 把 Clash.Meta 编译成 AAR，
      # 这一步由 Flutter 的 setup build hook 触发，因此 runner 上必须有 go。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: flutter pub get

      # freezed / json_serializable 的产物是提交在仓库里的，改了模型必须重新生成。
      # 生成期间先关掉原生 build hook，免得为了跑 Dart 代码去编译 Go 和 Rust。
      - name: Generate models
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run build_runner build --delete-conflicting-outputs
          yq -i '.hooks.user_defines.setup.build_assets = true | .hooks.user_defines.rust_api.build_assets = true' pubspec.yaml

      # 仓库 Settings → Secrets and variables → Actions 里配置以下四个后，
      # 产物会自动用你的密钥签名（app-release.apk，包名 com.follow.clash）：
      #   KEYSTORE       keystore 文件的 base64（单行）
      #   KEY_ALIAS      flclash
      #   STORE_PASSWORD keystore 口令
      #   KEY_PASSWORD   密钥口令（PKCS12 下与上面的相同）
      # 没配置时输出未签名 APK（app-release-unsigned.apk），需本地 apksigner 手动签。
      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # secret 里可能混入换行或空白（手机端粘贴长串常被自动折行），必须先剔除再解码
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks
          size=$(stat -c%s android/app/keystore.jks)
          if [ "$size" -lt 1000 ]; then
            echo "::error::keystore 解码后仅 ${size} 字节，KEYSTORE secret 不完整"
            exit 1
          fi
          echo "keystore ok: ${size} bytes"
          touch android/local.properties
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          GH_TOKEN: ${{ github.token }}
          # 签名参数走 Gradle 属性，避免被 flutter 重写 local.properties 冲掉
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: keystore.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 没有 release keystore 时产出未签名 APK，由本地 apksigner 手动签名，
          # 避免 runner 每次临时生成的 debug 签名导致覆盖安装失败。
          ORG_GRADLE_PROJECT_unsigned: "true"
        run: |
          # versionCode = YYMMDD + 当日三位序号（001、002…），必须单调递增且不超过 2100000000。
          # 当天的序号 = 本工作流今天已经触发的运行数（含本次），所以第一次就是 001。
          day=$(date -u +%y%m%d)
          seq=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-android.yml/runs?per_page=100" \
            | jq --arg d "$(date -u +%Y-%m-%d)" \
              '[.workflow_runs[] | select(.created_at | startswith($d))] | length')
          # API 不可用时退回 run_number，保证同一个 versionCode 也能覆盖安装。
          if [ -z "$seq" ] || [ "$seq" -lt 1 ]; then
            seq=$(( ${{ github.run_number }} % 1000 ))
          fi
          build_number="${day}$(printf '%03d' "$seq")"
          base=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          build_name="${base}-coloros.${{ github.run_number }}"
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$build_name" --build-number="$build_number"
          {
            echo "### APK"
            echo ""
            echo "- versionName: $build_name"
            echo "- versionCode: $build_number"
          } >> "$GITHUB_STEP_SUMMARY"

      # 配了签名却没产出带签名的包时直接失败，避免把 -unsigned 的包当成成品发出去
      - name: Verify APK signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::未找到 $apk，签名配置没有生效"
            ls -l build/app/outputs/flutter-apk/ || true
            grep -E 'keystore|keyAlias|storePassword' android/local.properties || true
            exit 1
          fi
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ColorOS-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          overwrite: true
