name: build-android

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与仓库 .github/workflows/build.yaml 保持一致，改 Flutter 版本前先看 .agents/flutter-upgrade.md
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # .gitmodules 里写的是 git@github.com: 的 SSH 地址，runner 上没有 SSH key，
      # 这里统一改写为 HTTPS 再拉子模块（Clash.Meta 核心与 prism_ui）。
      - name: Checkout submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # :core 模块通过 gomobile bind 把 Clash.Meta 编译成 AAR，
      # 这一步由 Flutter 的 setup build hook 触发，因此 runner 上必须有 go。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: flutter pub get

      # freezed / json_serializable 的产物是提交在仓库里的，改了模型必须重新生成。
      # 生成期间先关掉原生 build hook，免得为了跑 Dart 代码去编译 Go 和 Rust。
      - name: Generate models
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run build_runner build --delete-conflicting-outputs
          yq -i '.hooks.user_defines.setup.build_assets = true | .hooks.user_defines.rust_api.build_assets = true' pubspec.yaml

      # 可选：在仓库 Settings → Secrets 里配好 KEYSTORE / KEY_ALIAS /
      # STORE_PASSWORD / KEY_PASSWORD 就会用正式签名，否则走 debug 签名。
      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # versionCode 必须单调递增，否则装不上旧版本；用 yyMMddHHmm 保证全局递增。
          build_number=$(date +%y%m%d%H%M)
          base=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          build_name="${base}-coloros.${{ github.run_number }}"
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$build_name" --build-number="$build_number"
          {
            echo "### APK"
            echo ""
            echo "- versionName: $build_name"
            echo "- versionCode: $build_number"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ColorOS-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          overwrite: true
